<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15131b">
  <title>Chat EPN · Sala general</title>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./app.js"></script>
</head>
<body>
  <button class="tool-button" id="theme-button" type="button"
    aria-label="Activar modo oscuro" title="Activar modo oscuro">
    <svg id="theme-moon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20.9 13.3a9 9 0 0 1-10.2-10.2 9 9 0 1 0 10.2 10.2Z"/>
    </svg>
    <svg id="theme-sun" viewBox="0 0 24 24" aria-hidden="true" hidden>
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>
    </svg>
  </button>

  <div class="shell">
    <main>
      <section class="auth-card" id="auth-panel" aria-labelledby="auth-title">
        <h1 id="auth-title">Inicia sesión</h1>
        <p id="auth-description">Accede con tu cuenta para entrar a la sala general.</p>
        <form id="auth-form">
          <fieldset id="auth-fields" disabled>
            <label id="name-field" hidden>Nombre visible
              <input id="display-name" name="displayName" autocomplete="nickname" maxlength="40" disabled>
            </label>
            <label>Correo electrónico
              <input id="email" name="email" type="email" autocomplete="email" required>
            </label>
            <label>Contraseña
              <input id="password" name="password" type="password" autocomplete="current-password" required>
            </label>
            <button id="auth-submit" type="submit">Iniciar sesión</button>
          </fieldset>
        </form>
        <p class="feedback" id="auth-message" role="status" hidden></p>
        <div class="auth-actions">
          <button class="text-button" id="auth-switch" type="button" disabled>Crear una cuenta</button>
          <button class="text-button" id="cancel-profile" type="button" hidden>Cerrar sesión</button>
        </div>
      </section>

      <section class="chat-card" id="chat-panel" aria-labelledby="chat-title" hidden>
        <header class="room-header">
          <div class="room-identity">
            <span class="room-mark" aria-hidden="true">#</span>
            <div>
              <h1 id="chat-title">Sala general</h1>
              <div class="room-details" role="status">
                <span class="connection" id="connection" data-state="offline">Desconectado</span>
                <span id="presence">0 usuarios en línea</span>
              </div>
            </div>
          </div>
          <div class="account">
            <span id="account-name"></span>
            <button class="secondary" id="logout" type="button">Cerrar sesión</button>
          </div>
        </header>

        <div class="timeline" id="timeline" tabindex="0" aria-label="Conversación">
          <div class="empty" id="empty" hidden>
            <strong>Aún no hay mensajes</strong>
            <p>Toca el sticker para saludar.</p>
            <button id="say-hello" type="button" aria-label="Enviar sticker de saludo" title="Enviar sticker de saludo">
              <img src="./greeting.png" width="172" height="172" alt="">
            </button>
          </div>
          <ol id="messages" aria-label="Mensajes"></ol>
        </div>

        <footer class="composer">
          <p class="typing" id="typing" role="status"></p>
          <p class="feedback" id="chat-message" role="status" hidden></p>
          <div class="attachment-draft" id="attachment-draft" hidden>
            <div>
              <span id="attachment-label"></span>
              <div id="attachment-preview"></div>
            </div>
            <button class="tool-button" id="remove-attachment" type="button" aria-label="Quitar adjunto" title="Quitar adjunto">×</button>
          </div>
          <div class="recording" id="recording" hidden>
            <span id="recording-status" role="status">Grabando nota de voz</span>
            <button type="button" class="text-button" id="cancel-recording">Cancelar</button>
          </div>
          <div class="emoji-picker" id="emoji-picker" aria-label="Emojis" hidden></div>
          <form id="message-form" novalidate>
            <input id="file-input" type="file" hidden>
            <button class="tool-button" id="attach" type="button" aria-label="Adjuntar archivo" title="Adjuntar archivo" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m20 11-7.7 7.7a4 4 0 0 1-5.7-5.7l8-8a2.6 2.6 0 0 1 3.7 3.7l-8 8a1.3 1.3 0 0 1-1.8-1.8l6.7-6.7"/></svg>
            </button>
            <label class="sr-only" for="message-input">Mensaje</label>
            <input id="message-input" name="message" placeholder="Escribe un mensaje…" autocomplete="off"
              aria-describedby="message-length">
            <button class="tool-button" id="emoji" type="button" aria-label="Elegir emoji" title="Emojis" aria-expanded="false" aria-controls="emoji-picker" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 14a4.3 4.3 0 0 0 8 0M9 9h.01M15 9h.01"/></svg>
            </button>
            <button class="round-action" id="record" type="button" aria-label="Grabar nota de voz" title="Grabar nota de voz" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 11a6 6 0 0 0 12 0m-6 6v4m-3 0h6"/></svg>
            </button>
            <button class="round-action" id="send" type="submit" aria-label="Enviar" title="Enviar" disabled hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 4-7 16-3.5-6.5L4 10l17-6ZM21 4l-10.5 9.5"/></svg>
            </button>
          </form>
          <p class="message-length" id="message-length">0 / 500</p>
        </footer>
      </section>
    </main>
  </div>
</body>
</html>
